name: Runner CI

on:
  workflow_dispatch:
  push:
    branches:
    - main
    - releases/*
    paths-ignore:
    - '**.md'
    - 'images/**'
  pull_request:
    branches:
    - '**'
    paths-ignore:
    - '**.md'
    - 'images/**'

jobs:
  build:
    strategy:
      matrix:
        runtime: [ linux-x64, linux-arm64 ]
        include:
        - runtime: linux-x64
          os: ubuntu-latest
          devScript: ./dev.sh

        - runtime: linux-arm64
          os: ubuntu-latest
          devScript: ./dev.sh

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5

    # Build runner layout
    - name: Build & Layout Release
      run: |
        ${{ matrix.devScript }} layout Release ${{ matrix.runtime }}
      working-directory: src

    # Run tests
    - name: L0
      env:
        # SelfUpdaterL0.TestSelfUpdateAsync_NoUpdateOnOldVersion asserts that a
        # refresh to 2.200.0 is declined for being older than the running runner.
        # This fork pins src/runnerversion to 0.0.1. publish-image.yml uses that
        # file to tag the image, but this L0 job also compiles it: src/dev.sh
        # passes it as RunnerVersion and src/dir.proj writes it into
        # BuildConstants.RunnerPackage.Version, so 2.200.0 compares as newer and
        # the test drives a real self-update download instead. Drop this filter
        # once src/runnerversion tracks the RUNNER_VERSION in images/Dockerfile.
        TestFilter: 'FullyQualifiedName!=GitHub.Runner.Common.Tests.Listener.SelfUpdaterL0.TestSelfUpdateAsync_NoUpdateOnOldVersion'
      run: |
        ${{ matrix.devScript }} test
      working-directory: src
      if: matrix.runtime != 'linux-arm64'

    # Create runner package tar.gz/zip
    - name: Package Release
      if: github.event_name != 'pull_request'
      run: |
        ${{ matrix.devScript }} package Release
      working-directory: src

    # Upload runner package tar.gz/zip as artifact
    - name: Publish Artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v6
      with:
        name: runner-package-${{ matrix.runtime }}
        path: |
          _package
