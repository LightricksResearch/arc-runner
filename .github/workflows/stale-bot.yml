name: Stale Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * 1' # every Monday at 00:30 UTC
concurrency:
  group: arc-runner-stale
  cancel-in-progress: false
permissions:
  actions: write
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          stale-issue-message: "This issue is stale because it has been open 365 days with no activity. Remove stale label or comment or this will be closed in 15 days."
          close-issue-message: "This issue was closed because it has been stalled for 15 days with no activity."
          exempt-issue-labels: "keep"
          days-before-stale: 365
          days-before-close: 15
          operations-per-run: 1000